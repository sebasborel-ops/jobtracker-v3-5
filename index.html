<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTracker V3.5</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div>

        <h1>JobTracker V3.5</h1>

        <div id="todayDate" class="today-date"></div>

    </div>

    <div class="top-stats">

        <div
            class="mini-stat"
            onclick="setFilter('all')">

            <span>Total</span>

            <strong id="totalCount">0</strong>

        </div>

        <div
            class="mini-stat"
            onclick="setFilter('a_envoyer')">

            <span>À envoyer</span>

            <strong id="todoCount">0</strong>

        </div>

        <div
            class="mini-stat"
            onclick="setFilter('process')">

            <span>En processus</span>

            <strong id="processCount">0</strong>

        </div>

        <div
            class="mini-stat"
            onclick="setFilter('offer')">

            <span>Offres</span>

            <strong id="offerCount">0</strong>

        </div>

        <div
            class="mini-stat"
            onclick="setFilter('refus')">

            <span>Refus</span>

            <strong id="refusCount">0</strong>

        </div>

    </div>

    <button
        id="legendBtn"
        class="legend-btn">

        ❔ Statuts

    </button>

</header>

<!-- LEGENDE -->

<div id="legendModal" class="legend-modal">

    <div class="legend-content">

        <h3>Signification des statuts</h3>

        <ul>

            <li>🟡 À envoyer</li>
            <li>🔵 En attente</li>
            <li>🟣 Roster</li>
            <li>🟦 Pré-entretien</li>
            <li>🟧 Test écrit</li>
            <li>🟩 Entretien</li>
            <li>🟢 Offre reçue</li>
            <li>✅ Offre acceptée</li>
            <li>🔴 Refus</li>
            <li>⚫ Retirée</li>

        </ul>

        <button
            id="closeLegend">

            Fermer

        </button>

    </div>

</div>

<main class="main-layout">

    <!-- FORMULAIRE -->

    <aside class="left-panel">

        <div class="panel">

            <h2>Candidature</h2>

            <div class="form-grid">

                <div class="field">

                    <label>Employeur</label>

                    <input
                        id="employer"
                        type="text">

                </div>

                <div class="field">

                    <label>Poste</label>

                    <input
                        id="position"
                        type="text">

                </div>

                <div class="field">

                    <label>Grade</label>

                    <input
                        id="grade"
                        type="text">

                </div>

                <div class="field">

                    <label>Localisation</label>

                    <input
                        id="location"
                        type="text">

                </div>

                <div class="field">

                    <label>Lien offre</label>

                    <input
                        id="jobLink"
                        type="text">

                </div>

                <div class="field">

                    <label>Statut</label>

                    <select id="status">

                        <option>À envoyer</option>

                        <option>En attente</option>

                        <option>Roster</option>

                        <option>Pré-entretien</option>

                        <option>Test écrit</option>

                        <option>Entretien</option>

                        <option>Offre reçue</option>

                        <option>Offre acceptée</option>

                        <option>Refus</option>

                        <option>Retirée</option>

                    </select>

                </div>

            </div>

            <h3>Dates</h3>

            <div class="dates-section">

                <label>Date limite</label>

                <div class="date-row">

                    <input id="deadlineDay" maxlength="2" placeholder="JJ">

                    <input id="deadlineMonth" maxlength="2" placeholder="MM">

                    <input id="deadlineYear" maxlength="4" placeholder="AAAA">

                </div>

                <label>Date candidature</label>

                <div class="date-row">

                    <input id="applicationDay" maxlength="2" placeholder="JJ">

                    <input id="applicationMonth" maxlength="2" placeholder="MM">

                    <input id="applicationYear" maxlength="4" placeholder="AAAA">

                </div>

                <label>Pré-entretien</label>

                <div class="date-row">

                    <input id="preDay" maxlength="2" placeholder="JJ">

                    <input id="preMonth" maxlength="2" placeholder="MM">

                    <input id="preYear" maxlength="4" placeholder="AAAA">

                </div>

                <label>Test écrit</label>

                <div class="date-row">

                    <input id="testDay" maxlength="2" placeholder="JJ">

                    <input id="testMonth" maxlength="2" placeholder="MM">

                    <input id="testYear" maxlength="4" placeholder="AAAA">

                </div>

                <label>Entretien</label>

                <div class="date-row">

                    <input id="interviewDay" maxlength="2" placeholder="JJ">

                    <input id="interviewMonth" maxlength="2" placeholder="MM">

                    <input id="interviewYear" maxlength="4" placeholder="AAAA">

                </div>

            </div>

            <div class="field">

                <label>Notes</label>

                <textarea id="notes"></textarea>

            </div>

            <!-- FUTURES PIECES JOINTES -->

            <div class="field">

                <label>Pièces jointes</label>

                <input
                    type="file"
                    id="attachments"
                    multiple>

            </div>

            <div id="attachmentList">
            </div>

            <div class="buttons">

                <button
                    id="saveBtn"
                    class="save-btn"
                    onclick="addCandidate()">

                    Ajouter

                </button>

            </div>

            <div class="actions">

                <button onclick="exportData()">
                    Export JSON
                </button>

                <input
                    type="file"
                    id="importFile"
                    onchange="importData(event)">

            </div>

        </div>

    </aside>

    <!-- CARTES -->

    <section class="right-panel">

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="🔍 Rechercher..."
                onkeyup="renderJobs()">

        </div>

        <section
            id="cardsContainer"
            class="cards-container">

        </section>

    </section>

</main>

<script src="app.js"></script>

</body>

</html>
